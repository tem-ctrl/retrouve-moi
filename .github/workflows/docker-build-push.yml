name: Docker Build Push

# Builds the production images and pushes them to GitHub Container Registry, tagged with the
# commit SHA (for rollbacks) and `latest` (what deploy.yml runs). Called by release.yml after CI
# passes on main; can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

# Never cancelled: a cancelled build would stop the release that called it.
concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: nextjs
            context: ./ui
            file: ./ui/Dockerfile
            target: ""
          - image: php-fpm
            context: ./api
            file: ./api/docker/php-fpm/Dockerfile
            target: production
          - image: nginx
            context: ./api
            file: ./api/docker/nginx/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache scope per image, so the three builds don't overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # NEXT_PUBLIC_* values are inlined into the UI bundle at build time. Unused by the API images.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.retrouve-moi.com/api' }}
