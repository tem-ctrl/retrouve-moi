name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-nextjs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Next.js image
        id: meta-nextjs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Next.js image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta-nextjs.outputs.tags }}
          labels: ${{ steps.meta-nextjs.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=24.13.0-slim

  deployment-summary:
    needs: [build-and-push-nextjs]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Create deployment summary
        run: |
          echo "✅ Docker image built and pushed to GHCR successfully!"
          echo ""
          echo "📦 Next.js Image:"
          echo "   ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "🚀 Deploy to VPS with:"
          echo "   docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "   docker-compose -f docker-compose.vps.yml up -d"
