services:

  traefik:
    image: traefik:v2.11

    container_name: rm-traefik

    restart: unless-stopped

    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      - "--certificatesresolvers.letsencrypt.acme.email=gilbertemgoua@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      - "--log.level=DEBUG"

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/letsencrypt:/letsencrypt"

    networks:
      - web

  ui:
    build:
      context: ./ui
    container_name: rm-ui

    restart: unless-stopped

    labels:
      - "traefik.enable=true"

      # HTTP
      - "traefik.http.routers.ui-http.rule=Host(`retrouve-moi.com`) || Host(`www.retrouve-moi.com`)"
      - "traefik.http.routers.ui-http.entrypoints=web"

      # HTTPS
      - "traefik.http.routers.ui.rule=Host(`retrouve-moi.com`) || Host(`www.retrouve-moi.com`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls=true"
      - "traefik.http.routers.ui.tls.certresolver=letsencrypt"

      - "traefik.http.services.ui.loadbalancer.server.port=3000"

      # Redirect HTTP to HTTPS
      - "traefik.http.middlewares.redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.ui-http.middlewares=redirect"

    networks:
      - web

  nginx:
    build:
      context: ./api
      dockerfile: ./docker/nginx/Dockerfile
    container_name: rm-nginx
    restart: unless-stopped

    depends_on:
      - php-fpm

    volumes:
      - ./api:/var/www
      - laravel_storage:/var/www/storage
      - ./api/docker/nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=report-missing_web"

      # HTTP router (REQUIRED for ACME)
      - "traefik.http.routers.api-http.rule=Host(`api.retrouve-moi.com`)"
      - "traefik.http.routers.api-http.entrypoints=web"

      # redirect HTTP → HTTPS
      - "traefik.http.routers.api-http.middlewares=api-redirect"
      - "traefik.http.middlewares.api-redirect.redirectscheme.scheme=https"

      # HTTPS router
      - "traefik.http.routers.api.rule=Host(`api.retrouve-moi.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"

      - "traefik.http.services.api.loadbalancer.server.port=80"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      web:
        aliases:
          - api
      internal:

  php-fpm:
    container_name: rm-php-fpm
    build:
      context: ./api
      dockerfile: ./docker/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    volumes:
      - laravel_storage:/var/www/storage
    env_file:
      - ./api/.env
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy

  php-cli:
    container_name: rm-php-cli
    build:
      context: ./api
      dockerfile: ./docker/php-cli/Dockerfile
    tty: true
    stdin_open: true
    env_file:
      - ./api/.env
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/storage

  # queue:
  #   build:
  #     context: ./api
  #     dockerfile: docker/php-fpm/Dockerfile
  #   container_name: rm-queue
  #   restart: unless-stopped
  #   working_dir: /var/www
  #   command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --queue=default

  #   env_file:
  #     - ./api/.env

  #   volumes:
  #     - laravel_storage:/var/www/storage

  #   depends_on:
  #     - php-fpm
  #     - redis

  #   networks:
  #     - internal

  scheduler:
    build:
      context: ./api
      dockerfile: docker/php-fpm/Dockerfile
    container_name: rm-scheduler
    restart: unless-stopped
    working_dir: /var/www

    command: >
      sh -c "while true;
      do php artisan schedule:run --verbose --no-interaction;
      sleep 60;
      done"

    env_file:
      - ./api/.env

    volumes:
      - laravel_storage:/var/www/storage

    depends_on:
      - php-fpm

    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: rm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - internal

  mysql:
    image: mysql:8.0.45
    container_name: rm-mysql
    user: mysql
    restart: unless-stopped
    env_file:
      - ./api/.env

    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  redis_data:
  laravel_storage:

networks:
  web:
  internal:
