# Production stack. The Deploy workflow (.github/workflows/deploy.yml) copies this file to the
# deploy directory on the VPS, next to api/.env and ui/.env, and runs `docker compose up -d`.
# See docs/deployment.md.
#
# TLS and routing come from the nginx installed on the VPS (deploy/vps-nginx/retrouve-moi.conf).
# ui and nginx publish their ports on 127.0.0.1 only, for it.

# Prevent docker from assigning namespace based on folder name, which would cause all volumes
# and networks to be recreated on each deploy.
namespace: retrouve-moi

services:

  ui:
    image: "ghcr.io/tem-ctrl/retrouve-moi-nextjs:latest"
    env_file:
      - ./ui/.env
    container_name: rm-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - web

  nginx:
    image: "ghcr.io/tem-ctrl/retrouve-moi-nginx:latest"
    container_name: rm-nginx
    restart: unless-stopped
    # Port 80 on the host belongs to the VPS's nginx.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - php-fpm
    # public/ comes from the image; only the uploads are shared with php-fpm.
    volumes:
      - laravel_storage:/var/www/storage
      - uploads:/var/www/public/uploads
    # Health check: the image's own HEALTHCHECK (wget http://localhost/health-check).
    networks:
      - web
      - internal

  php-fpm:
    image: "ghcr.io/tem-ctrl/retrouve-moi-php-fpm:latest"
    container_name: rm-php-fpm
    restart: unless-stopped
    volumes:
      - laravel_storage:/var/www/storage
      - uploads:/var/www/public/uploads
    env_file:
      - ./api/.env
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The entrypoint runs the migrations before starting php-fpm.
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  # queue:
  #   build:
  #     context: ./api
  #     dockerfile: docker/php-fpm/Dockerfile
  #   container_name: rm-queue
  #   restart: unless-stopped
  #   working_dir: /var/www
  #   command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --queue=default

  #   env_file:
  #     - ./api/.env

  #   volumes:
  #     - laravel_storage:/var/www/storage

  #   depends_on:
  #     - php-fpm
  #     - redis

  #   networks:
  #     - internal

  scheduler:
    image: "ghcr.io/tem-ctrl/retrouve-moi-php-fpm:latest"
    container_name: rm-scheduler
    restart: unless-stopped
    working_dir: /var/www

    command: >
      sh -c "while true;
      do php artisan schedule:run --verbose --no-interaction;
      sleep 60;
      done"

    env_file:
      - ./api/.env

    volumes:
      - laravel_storage:/var/www/storage
      - uploads:/var/www/public/uploads

    depends_on:
      - php-fpm

    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: rm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - internal

  mysql:
    image: mysql:8.0.45
    container_name: rm-mysql
    user: mysql
    restart: unless-stopped
    env_file:
      - ./api/.env

    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  redis_data:
  laravel_storage:
  uploads:

networks:
  web:
    name: web
  internal:
    name: internal
