services:

  traefik:
    image: traefik:v3.1
    container_name: rm-traefik
    restart: unless-stopped

    command:
      - --api.dashboard=true

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --certificatesresolvers.letsencrypt.acme.email=admin@retrouve-moi.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web

      # Logging
      - --accesslog=true
      - --log.level=INFO

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt:/letsencrypt

    networks:
      - web

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: rm-ui
    restart: unless-stopped
    env_file:
      - .env

    labels:
      - traefik.enable=true

      # Router
      - traefik.http.routers.ui.rule=Host(`retrouve-moi.com`) || Host(`www.retrouve-moi.com`)
      - traefik.http.routers.ui.entrypoints=websecure
      - traefik.http.routers.ui.tls=true
      - traefik.http.routers.ui.tls.certresolver=letsencrypt

      # Service
      - traefik.http.services.ui.loadbalancer.server.port=3000

      # Compression
      - traefik.http.middlewares.compress.compress=true

      # Security headers
      - traefik.http.middlewares.secure.headers.browserXssFilter=true
      - traefik.http.middlewares.secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.secure.headers.forceSTSHeader=true
      - traefik.http.middlewares.secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.secure.headers.stsPreload=true
      - traefik.http.middlewares.secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.secure.headers.referrerPolicy=no-referrer-when-downgrade

      # HTTPS redirect
      - traefik.http.middlewares.redirectscheme.redirectscheme.scheme=https

      # Apply middlewares
      - traefik.http.routers.ui.middlewares=compress,secure

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: rm-nginx
    restart: unless-stopped

    depends_on:
      - php

    volumes:
      - ./api:/var/www
      - laravel_storage:/var/www/storage
      - ./api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    labels:
      - traefik.enable=true

      # Router
      - traefik.http.routers.api.rule=Host(`api.retrouve-moi.com`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=letsencrypt

      # Service
      - traefik.http.services.api.loadbalancer.server.port=80

      # Compression
      - traefik.http.middlewares.compress.compress=true

      # Security headers
      - traefik.http.middlewares.secure.headers.browserXssFilter=true
      - traefik.http.middlewares.secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.secure.headers.forceSTSHeader=true
      - traefik.http.middlewares.secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.secure.headers.stsPreload=true
      - traefik.http.middlewares.secure.headers.stsSeconds=31536000

      # Apply middlewares
      - traefik.http.routers.api.middlewares=compress,secure

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - web
      - internal

  php:
    build:
      context: ./api
      dockerfile: docker/php-fpm/Dockerfile
    container_name: rm-php
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env

    volumes:
      - ./api:/var/www
      - laravel_storage:/var/www/storage

    depends_on:
      - db
      - redis

    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - internal

  queue:
    build:
      context: ./api
      dockerfile: docker/php-fpm/Dockerfile
    container_name: rm-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --queue=default

    env_file:
      - .env

    volumes:
      - ./api:/var/www
      - laravel_storage:/var/www/storage

    depends_on:
      - php
      - redis

    networks:
      - internal

  scheduler:
    build:
      context: ./api
      dockerfile: docker/php-fpm/Dockerfile
    container_name: rm-scheduler
    restart: unless-stopped
    working_dir: /var/www

    command: >
      sh -c "while true;
      do php artisan schedule:run --verbose --no-interaction;
      sleep 60;
      done"

    env_file:
      - .env

    volumes:
      - ./api:/var/www
      - laravel_storage:/var/www/storage

    depends_on:
      - php

    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: rm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - internal

  db:
    image: mysql:8.4
    container_name: rm-db
    restart: unless-stopped

    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
      - --max-connections=200

    env_file:
      - ./api/.env

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - internal

volumes:
  mysql_data:
  redis_data:
  laravel_storage:

networks:
  web:
  internal:
