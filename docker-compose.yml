services:

  traefik:
    image: traefik:v3.7
    container_name: rm-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/letsencrypt:/letsencrypt"
    networks:
      - web

  ui:
    image: "ghcr.io/${GITHUB_USERNAME}/report-missing:latest"
    env_file:
      - ./ui/.env
    container_name: rm-ui
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui-http.rule=Host(`retrouve-moi.com`) || Host(`www.retrouve-moi.com`)"
      - "traefik.http.routers.ui-http.service=ui"
      - "traefik.http.services.ui.loadbalancer.server.port=3000"
    networks:
      - web

  nginx:
    build:
      context: ./api
      dockerfile: ./docker/nginx/Dockerfile
    container_name: rm-nginx
    restart: unless-stopped
    depends_on:
      - php-fpm
    volumes:
      - ./api:/var/www
      - laravel_storage:/var/www/storage
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.api.rule=Host(`api.retrouve-moi.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web
      - internal

  php-fpm:
    container_name: rm-php-fpm
    build:
      context: ./api
      dockerfile: ./docker/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    volumes:
      - laravel_storage:/var/www/storage
    env_file:
      - ./api/.env
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy

  php-cli:
    container_name: rm-php-cli
    build:
      context: ./api
      dockerfile: ./docker/php-cli/Dockerfile
    tty: true
    stdin_open: true
    env_file:
      - ./api/.env
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/storage

  # queue:
  #   build:
  #     context: ./api
  #     dockerfile: docker/php-fpm/Dockerfile
  #   container_name: rm-queue
  #   restart: unless-stopped
  #   working_dir: /var/www
  #   command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --queue=default

  #   env_file:
  #     - ./api/.env

  #   volumes:
  #     - laravel_storage:/var/www/storage

  #   depends_on:
  #     - php-fpm
  #     - redis

  #   networks:
  #     - internal

  scheduler:
    build:
      context: ./api
      dockerfile: docker/php-fpm/Dockerfile
    container_name: rm-scheduler
    restart: unless-stopped
    working_dir: /var/www

    command: >
      sh -c "while true;
      do php artisan schedule:run --verbose --no-interaction;
      sleep 60;
      done"

    env_file:
      - ./api/.env

    volumes:
      - laravel_storage:/var/www/storage

    depends_on:
      - php-fpm

    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: rm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - internal

  mysql:
    image: mysql:8.0.45
    container_name: rm-mysql
    user: mysql
    restart: unless-stopped
    env_file:
      - ./api/.env

    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  redis_data:
  laravel_storage:

networks:
  web:
    name: web
  internal:
    name: internal
