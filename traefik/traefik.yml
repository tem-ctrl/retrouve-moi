global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false # Maximal security : do not expose API on port 8080

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: :443
    asDefault: true
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: retrouve-moi.com
            sans:
              - www.retrouve-moi.com
              - api.retrouve-moi.com

certificatesResolvers:
  letsencrypt:
    acme:
      email: gilbertemgoua@gmail.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

providers:
  providersThrottleDuration: 10s
  docker:
    exposedByDefault: false
    watch: true
    network: "web"
  file:
    directory: /etc/traefik/dynamic
    watch: true

accessLog:
  #filePath: "/var/log/access.log"
  bufferingSize: 100
  filters:
    statusCodes:
      - "200-299"
      - "300-399"
      - "400-499"
      - "500-599"
    retryAttempts: true
    minDuration: "10ms"

log:
  # Alternative logging levels are DEBUG, INFO, WARN, ERROR, FATAL, and PANIC.
  level: INFO
  #filePath: "/var/log/error.log"
  format: json
